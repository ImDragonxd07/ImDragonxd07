          font-family="Arial">
          
          {total_forks}
          
          </text>
          
          
          <rect x="870" y="125"
          width="270" height="90"
          rx="16"
          fill="#ffffff"
          fill-opacity=".035"
          stroke="#ffffff"
          stroke-opacity=".08"/>
          
          <text x="895" y="157"
          fill="#8b949e"
          font-size="11"
          font-family="Arial">
          
          FOLLOWERS
          
          </text>
          
          <text x="895" y="195"
          fill="#7c3aed"
          font-size="29"
          font-weight="bold"
          font-family="Arial">
          
          {user.get("followers", 0)}
          
          </text>
          
          </g>
          
          
          <!-- PROJECTS -->
          
          <text
          x="60"
          y="265"
          fill="#ffffff"
          font-size="20"
          font-weight="bold"
          font-family="Arial">
          
          Most Starred Projects
          
          </text>
          
          
          {repo_cards}
          
          
          <!-- LANGUAGE SECTION -->
          
          <text
          x="60"
