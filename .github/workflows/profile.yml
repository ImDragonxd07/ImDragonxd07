name: Update Profile Dashboard

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ImDragonxd07
        run: |

          python <<'PY'

          import os
          import math
          import requests

          from datetime import datetime, timezone

          from PIL import Image
          from PIL import ImageDraw
          from PIL import ImageFont
          from PIL import ImageFilter


          # ============================================================
          # CONFIG
          # ============================================================

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          WIDTH = 1200
          HEIGHT = 720

          FRAME_COUNT = 24
          FRAME_DURATION = 100

          API = "https://api.github.com"

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }


          # ============================================================
          # COLORS
          # ============================================================

          BACKGROUND = (7, 9, 13)

          CARD = (14, 17, 23)

          CARD_BORDER = (255, 255, 255, 13)

          WHITE = (232, 237, 243)

          MUTED = (139, 148, 158)

          CYAN = (0, 210, 255)

          PURPLE = (124, 58, 237)


          # ============================================================
          # FONTS
          # ============================================================

          REGULAR_FONT = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans.ttf"
          )

          BOLD_FONT = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSans-Bold.ttf"
          )


          def font(size, bold=False):

              return ImageFont.truetype(
                  BOLD_FONT if bold else REGULAR_FONT,
                  size
              )


          # ============================================================
          # GITHUB API
          # ============================================================

          def github(url, params=None):

              response = requests.get(
                  url,
                  headers=HEADERS,
                  params=params,
                  timeout=30
              )

              response.raise_for_status()

              return response.json()


          print("Fetching GitHub data...")


          user = github(
              f"{API}/users/{USERNAME}"
          )


          # ============================================================
          # REPOSITORIES
          # ============================================================

          repos = []

          page = 1

          while True:

              batch = github(
                  f"{API}/users/{USERNAME}/repos",
                  {
                      "per_page": 100,
                      "page": page,
                      "type": "owner",
                      "sort": "updated"
                  }
              )

              if not batch:
                  break

              repos.extend(batch)

              if len(batch) < 100:
                  break

              page += 1


          repos = [
              repo
              for repo in repos
              if not repo.get("fork", False)
          ]


          print(
              f"Found {len(repos)} repositories."
          )


          # ============================================================
          # BASIC STATS
          # ============================================================

          repository_count = len(repos)

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repos
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in repos
          )

          followers = user.get(
              "followers",
              0
          )


          # ============================================================
          # PROJECT RANKING
          # ============================================================

          def project_score(repo):

              return (
                  repo.get("stargazers_count", 0) * 10
                  +
                  repo.get("forks_count", 0) * 5
                  +
                  repo.get("watchers_count", 0)
              )


          repos.sort(
              key=project_score,
              reverse=True
          )


          projects = repos[:4]


          # ============================================================
          # LANGUAGES
          # ============================================================

          language_counts = {}

          for repo in repos:

              language = repo.get(
                  "language"
              )

              if language:

                  language_counts[language] = (
                      language_counts.get(
                          language,
                          0
                      ) + 1
                  )


          languages = sorted(
              language_counts.items(),
              key=lambda item: item[1],
              reverse=True
          )[:4]


          language_total = max(
              sum(
                  count
                  for _, count in languages
              ),
              1
          )


          # ============================================================
          # RECENT ACTIVITY
          # ============================================================

          activity = []

          try:

              events = github(
                  f"{API}/users/{USERNAME}/events/public",
                  {
                      "per_page": 100
                  }
              )

              for event in events:

                  created = event.get(
                      "created_at"
                  )

                  if not created:
                      continue

                  try:

                      dt = datetime.fromisoformat(
                          created.replace(
                              "Z",
                              "+00:00"
                          )
                      )

                      activity.append(
                          dt
                      )

                  except Exception:

                      pass

          except Exception:

              activity = []


          # ============================================================
          # HELPERS
          # ============================================================

          def rounded_box(
              draw,
              x1,
              y1,
              x2,
              y2,
              radius=12
          ):

              draw.rounded_rectangle(
                  (
                      x1,
                      y1,
                      x2,
                      y2
                  ),
                  radius=radius,
                  fill=CARD,
                  outline=CARD_BORDER,
                  width=1
              )


          def truncate(
              text,
              length
          ):

              if not text:
                  return ""

              text = str(text)

              if len(text) <= length:
                  return text

              return (
                  text[:length - 3]
                  + "..."
              )


          def mix(a, b, amount):

              return tuple(
                  int(
                      a[i] +
                      (b[i] - a[i])
                      * amount
                  )
                  for i in range(3)
              )


          # ============================================================
          # PARTICLES
          # ============================================================

          particles = []

          for i in range(18):

              particles.append(
                  (
                      (i * 97) % WIDTH,
                      (i * 157) % HEIGHT,
                      0.2 + (i % 4) * 0.05
                  )
              )


          # ============================================================
          # GENERATE FRAMES
          # ============================================================

          frames = []


          for frame in range(
              FRAME_COUNT
          ):

              print(
                  f"Rendering "
                  f"{frame + 1}/"
                  f"{FRAME_COUNT}"
              )


              t = (
                  frame /
                  FRAME_COUNT
              )


              image = Image.new(
                  "RGB",
                  (
                      WIDTH,
                      HEIGHT
                  ),
                  BACKGROUND
              )


              # --------------------------------------------------------
              # SUBTLE BACKGROUND GLOW
              # --------------------------------------------------------

              glow = Image.new(
                  "RGBA",
                  (
                      WIDTH,
                      HEIGHT
                  ),
                  (
                      0,
                      0,
                      0,
                      0
                  )
              )


              glow_draw = ImageDraw.Draw(
                  glow
              )


              gx = (
                  WIDTH * 0.15
                  +
                  math.sin(
                      t * math.pi * 2
                  ) * 170
              )


              gy = (
                  HEIGHT * 0.15
                  +
                  math.cos(
                      t * math.pi * 2
                  ) * 70
              )


              glow_draw.ellipse(
                  (
                      gx - 230,
                      gy - 230,
                      gx + 230,
                      gy + 230
                  ),
                  fill=(
                      CYAN[0],
                      CYAN[1],
                      CYAN[2],
                      18
                  )
              )


              gx2 = (
                  WIDTH * 0.85
                  +
                  math.cos(
                      t * math.pi * 2
                  ) * 160
              )


              gy2 = (
                  HEIGHT * 0.8
                  +
                  math.sin(
                      t * math.pi * 2
                  ) * 90
              )


              glow_draw.ellipse(
                  (
                      gx2 - 260,
                      gy2 - 260,
                      gx2 + 260,
                      gy2 + 260
                  ),
                  fill=(
                      PURPLE[0],
                      PURPLE[1],
                      PURPLE[2],
                      15
                  )
              )


              glow = glow.filter(
                  ImageFilter.GaussianBlur(
                      70
                  )
              )


              image = Image.alpha_composite(
                  image.convert("RGBA"),
                  glow
              )


              draw = ImageDraw.Draw(
                  image
              )


              # --------------------------------------------------------
              # SUBTLE PARTICLES
              # --------------------------------------------------------

              for x, y, speed in particles:

                  px = (
                      x
                      +
                      frame * speed * 5
                  ) % WIDTH


                  py = (
                      y
                      +
                      math.sin(
                          t * math.pi * 2
                          + x
                      ) * 3
                  )


                  draw.ellipse(
                      (
                          px,
                          py,
                          px + 1,
                          py + 1
                      ),
                      fill=(
                          255,
                          255,
                          255,
                          35
                      )
                  )


              # ========================================================
              # HEADER
              # ========================================================

              draw.text(
                  (
                      55,
                      35
                  ),
                  "GITHUB",
                  fill=WHITE,
                  font=font(
                      25,
                      True
                  )
              )


              draw.text(
                  (
                      55,
                      69
                  ),
                  USERNAME,
                  fill=MUTED,
                  font=font(12)
              )


              # very subtle moving accent

              accent_position = int(
                  55
                  +
                  (
                      (
                          math.sin(
                              t * math.pi * 2
                          )
                          + 1
                      )
                      / 2
                  )
                  * 1090
              )


              draw.rounded_rectangle(
                  (
                      55,
                      94,
                      1145,
                      96
                  ),
                  radius=1,
                  fill=(
                      255,
                      255,
                      255,
                      12
                  )
              )


              draw.rounded_rectangle(
                  (
                      accent_position - 80,
                      94,
                      accent_position + 80,
                      96
                  ),
                  radius=1,
                  fill=CYAN
              )


              # ========================================================
              # STATS
              # ========================================================

              stat_values = [
                  (
                      "REPOSITORIES",
                      repository_count
                  ),
                  (
                      "STARS",
                      stars
                  ),
                  (
                      "FORKS",
                      forks
                  ),
                  (
                      "FOLLOWERS",
                      followers
                  )
              ]


              stat_width = 255

              for i, (
                  label,
                  value
              ) in enumerate(
                  stat_values
              ):

                  x = (
                      55
                      +
                      i * 275
                  )


                  rounded_box(
                      draw,
                      x,
                      120,
                      x + stat_width,
                      195
                  )


                  draw.text(
                      (
                          x + 20,
                          140
                      ),
                      label,
                      fill=MUTED,
                      font=font(
                          10,
                          True
                      )
                  )


                  draw.text(
                      (
                          x + 20,
                          160
                      ),
                      str(value),
                      fill=(
                          CYAN
                          if i % 2 == 0
                          else PURPLE
                      ),
                      font=font(
                          24,
                          True
                      )
                  )


              # ========================================================
              # PROJECTS
              # ========================================================

              draw.text(
                  (
                      55,
                      225
                  ),
                  "PROJECTS",
                  fill=WHITE,
                  font=font(
                      16,
                      True
                  )
              )


              for i, repo in enumerate(
                  projects
              ):

                  column = i % 2

                  row = i // 2


                  x = (
                      55
                      +
                      column * 550
                  )


                  y = (
                      255
                      +
                      row * 105
                  )


                  rounded_box(
                      draw,
                      x,
                      y,
                      x + 530,
                      y + 88
                  )


                  name = truncate(
                      repo.get(
                          "name",
                          ""
                      ),
                      30
                  )


                  description = truncate(
                      repo.get(
                          "description",
                          ""
                      ),
                      58
                  )


                  draw.text(
                      (
                          x + 20,
                          y + 14
                      ),
                      name,
                      fill=WHITE,
                      font=font(
                          14,
                          True
                      )
                  )


                  if description:

                      draw.text(
                          (
                              x + 20,
                              y + 38
                          ),
                          description,
                          fill=MUTED,
                          font=font(
                              9
                          )
                      )


                  draw.text(
                      (
                          x + 20,
                          y + 63
                      ),
                      (
                          "★ "
                          + str(
                              repo.get(
                                  "stargazers_count",
                                  0
                              )
                          )
                          +
                          "    "
                          "◇ "
                          + str(
                              repo.get(
                                  "forks_count",
                                  0
                              )
                          )
                      ),
                      fill=CYAN,
                      font=font(
                          9,
                          True
                      )
                  )


              # ========================================================
              # LANGUAGES
              # ========================================================

              rounded_box(
                  draw,
                  55,
                  480,
                  565,
                  675
              )


              draw.text(
                  (
                      75,
                      500
                  ),
                  "LANGUAGES",
                  fill=WHITE,
                  font=font(
                      15,
                      True
                  )
              )


              for i, (
                  language,
                  count
              ) in enumerate(
                  languages
              ):

                  y = (
                      535
                      +
                      i * 27
                  )


                  percentage = (
                      count /
                      language_total
                  )


                  draw.text(
                      (
                          75,
                          y
                      ),
                      language,
                      fill=MUTED,
                      font=font(
                          9
                      )
                  )


                  draw.rounded_rectangle(
                      (
                          165,
                          y + 3,
                          525,
                          y + 10
                      ),
                      radius=4,
                      fill=(
                          255,
                          255,
                          255,
                          10
                      )
                  )


                  bar_color = mix(
                      CYAN,
                      PURPLE,
                      i /
                      max(
                          len(languages) - 1,
                          1
                      )
                  )


                  draw.rounded_rectangle(
                      (
                          165,
                          y + 3,
                          165
                          +
                          int(
                              360 *
                              percentage
                          ),
                          y + 10
                      ),
                      radius=4,
                      fill=bar_color
                  )


              # ========================================================
              # ACTIVITY
              # ========================================================

              rounded_box(
                  draw,
                  585,
                  480,
                  1145,
                  675
              )


              draw.text(
                  (
                      605,
                      500
                  ),
                  "ACTIVITY",
                  fill=WHITE,
                  font=font(
                      15,
                      True
                  )
              )


              # Activity dots

              now = datetime.now(
                  timezone.utc
              )


              for i in range(45):

                  x = (
                      605
                      +
                      (i % 15) * 32
                  )


                  y = (
                      535
                      +
                      (i // 15) * 32
                  )


                  # deterministic but subtle

                  wave = (
                      math.sin(
                          i * 1.7
                          +
                          t * math.pi * 2
                      )
                      + 1
                  ) / 2


                  has_activity = (
                      i <
                      min(
                          len(activity),
                          45
                      )
                  )


                  if has_activity:

                      alpha = int(
                          50
                          +
                          wave * 90
                      )

                      color = (
                          CYAN[0],
                          CYAN[1],
                          CYAN[2],
                          alpha
                      )

                  else:

                      color = (
                          255,
                          255,
                          255,
                          10
                      )


                  draw.rounded_rectangle(
                      (
                          x,
                          y,
                          x + 18,
                          y + 18
                      ),
                      radius=4,
                      fill=color
                  )


              # ========================================================
              # FRAME
              # ========================================================

              draw.rounded_rectangle(
                  (
                      1,
                      1,
                      WIDTH - 2,
                      HEIGHT - 2
                  ),
                  radius=18,
                  outline=(
                      255,
                      255,
                      255,
                      10
                  ),
                  width=1
              )


              frames.append(
                  image.convert("RGB")
              )


          # ============================================================
          # SAVE GIF
          # ============================================================

          os.makedirs(
              "assets",
              exist_ok=True
          )


          output = (
              "assets/dashboard.gif"
          )


          frames[0].save(
              output,
              save_all=True,
              append_images=frames[1:],
              duration=FRAME_DURATION,
              loop=0,
              optimize=True,
              disposal=2
          )


          print(
              "Dashboard created:"
          )

          print(output)

          print(
              "Size:",
              round(
                  os.path.getsize(output)
                  / 1024
                  / 1024,
                  2
              ),
              "MB"
          )

          PY

      - name: Commit dashboard
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/dashboard.gif

          if git diff --cached --quiet; then

            echo "Dashboard unchanged."

          else

            git commit \
              -m "Update profile dashboard"

            git push

          fi
