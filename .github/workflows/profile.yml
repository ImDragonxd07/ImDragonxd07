          </stop>
          
          </linearGradient>
          
          
          <radialGradient id="glow">
          
          <stop offset="0%" stop-color="#00d9ff" stop-opacity=".25"/>
          <stop offset="45%" stop-color="#7c3aed" stop-opacity=".1"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0"/>
          
          </radialGradient>
          
          
          <filter id="blur">
          
          <feGaussianBlur stdDeviation="35"/>
          
          </filter>
          
          
          <filter id="softGlow">
          
          <feGaussianBlur stdDeviation="8"/>
          
          </filter>
          
          </defs>
          
          
          <!-- BACKGROUND -->
          
          <rect
          width="1200"
          height="850"
          rx="24"
          fill="url(#bg)"/>
          
          
          <!-- MOVING GLOWS -->
          
          <circle
          cx="150"
