name: Generate Animated Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Generate animated dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ImDragonxd07
        run: |

          python <<'PY'

          import os
          import math
          import requests

          from PIL import Image
          from PIL import ImageDraw
          from PIL import ImageFont
          from PIL import ImageFilter
          from pathlib import Path


          # ============================================================
          # CONFIG
          # ============================================================

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          WIDTH = 1200
          HEIGHT = 760

          FRAMES = 24
          FRAME_DURATION = 90

          API = "https://api.github.com"

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }


          # ============================================================
          # FONTS
          # ============================================================

          FONT_REGULAR = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          FONT_BOLD = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          def font(size, bold=False):
              return ImageFont.truetype(
                  FONT_BOLD if bold else FONT_REGULAR,
                  size
              )


          # ============================================================
          # GITHUB API
          # ============================================================

          def github(url, params=None):

              response = requests.get(
                  url,
                  headers=HEADERS,
                  params=params,
                  timeout=30
              )

              response.raise_for_status()

              return response.json()


          print("Getting GitHub profile...")

          user = github(
              f"{API}/users/{USERNAME}"
          )


          # ============================================================
          # REPOSITORIES
          # ============================================================

          repos = []

          page = 1

          while True:

              batch = github(
                  f"{API}/users/{USERNAME}/repos",
                  {
                      "per_page": 100,
                      "page": page,
                      "type": "owner",
                      "sort": "updated"
                  }
              )

              if not batch:
                  break

              repos.extend(batch)

              if len(batch) < 100:
                  break

              page += 1


          print(f"Found {len(repos)} repositories.")


          # Don't show forks in the project dashboard.

          owned_repos = [
              r for r in repos
              if not r.get("fork", False)
          ]


          # ============================================================
          # STATS
          # ============================================================

          repo_count = len(owned_repos)

          total_stars = sum(
              r.get("stargazers_count", 0)
              for r in owned_repos
          )

          total_forks = sum(
              r.get("forks_count", 0)
              for r in owned_repos
          )

          followers = user.get("followers", 0)


          # ============================================================
          # PROJECT RANKING
          #
          # Combines stars + forks + recent activity.
          # This means the dashboard automatically chooses
          # interesting projects instead of requiring a manual list.
          # ============================================================

          def project_score(repo):

              stars = repo.get("stargazers_count", 0)
              forks = repo.get("forks_count", 0)
              watchers = repo.get("watchers_count", 0)

              return (
                  stars * 10 +
                  forks * 5 +
                  watchers
              )


          owned_repos.sort(
              key=project_score,
              reverse=True
          )


          projects = owned_repos[:6]


          # ============================================================
          # LANGUAGES
          # ============================================================

          language_counts = {}

          for repo in owned_repos:

              language = repo.get("language")

              if language:

                  language_counts[language] = (
                      language_counts.get(language, 0) + 1
                  )


          languages = sorted(
              language_counts.items(),
              key=lambda x: x[1],
              reverse=True
          )[:5]


          # ============================================================
          # CONTRIBUTION DATA
          #
          # GitHub's public events API is used here so no personal
          # access token is required.
          # ============================================================

          events = []

          page = 1

          while page <= 3:

              try:

                  batch = github(
                      f"{API}/users/{USERNAME}/events/public",
                      {
                          "per_page": 100,
                          "page": page
                      }
                  )

              except Exception:

                  break

              if not batch:
                  break

              events.extend(batch)

              if len(batch) < 100:
                  break

              page += 1


          # Count recent contribution activity by day.

          from datetime import datetime, timezone

          contribution_days = {}

          for event in events:

              created = event.get("created_at")

              if not created:
                  continue

              try:

                  dt = datetime.fromisoformat(
                      created.replace("Z", "+00:00")
                  )

                  day = dt.date().isoformat()

                  contribution_days[day] = (
                      contribution_days.get(day, 0) + 1
                  )

              except Exception:

                  pass


          # ============================================================
          # COLORS
          # ============================================================

          BG = (5, 6, 13)

          CYAN = (0, 217, 255)

          PURPLE = (124, 58, 237)

          WHITE = (245, 247, 255)

          MUTED = (139, 148, 158)

          CARD = (255, 255, 255, 9)

          BORDER = (255, 255, 255, 18)


          # ============================================================
          # HELPERS
          # ============================================================

          def lerp(a, b, t):

              return int(a + (b - a) * t)


          def gradient_color(t):

              t = t % 1.0

              if t < .5:

                  p = t * 2

                  return (
                      lerp(CYAN[0], PURPLE[0], p),
                      lerp(CYAN[1], PURPLE[1], p),
                      lerp(CYAN[2], PURPLE[2], p)
                  )

              else:

                  p = (t - .5) * 2

                  return (
                      lerp(PURPLE[0], CYAN[0], p),
                      lerp(PURPLE[1], CYAN[1], p),
                      lerp(PURPLE[2], CYAN[2], p)
                  )


          def rounded_card(draw, box):

              draw.rounded_rectangle(
                  box,
                  radius=16,
                  fill=(255, 255, 255, 7),
                  outline=(255, 255, 255, 18),
                  width=1
              )


          def truncate(text, max_chars):

              if not text:

                  return ""

              text = str(text)

              if len(text) <= max_chars:

                  return text

              return text[:max_chars - 3] + "..."


          # ============================================================
          # PARTICLES
          # ============================================================

          particles = []

          for i in range(80):

              particles.append({
                  "x": (i * 173) % WIDTH,
                  "y": (i * 97) % HEIGHT,
                  "speed": .15 + ((i * 13) % 20) / 100,
                  "size": 1 + (i % 3)
              })


          # ============================================================
          # GENERATE FRAMES
          # ============================================================

          frames = []

          for frame_number in range(FRAMES):

              print(
                  f"Rendering frame "
                  f"{frame_number + 1}/{FRAMES}"
              )

              t = frame_number / FRAMES

              image = Image.new(
                  "RGBA",
                  (WIDTH, HEIGHT),
                  BG + (255,)
              )

              draw = ImageDraw.Draw(
                  image,
                  "RGBA"
              )


              # --------------------------------------------------------
              # MOVING GRADIENT BACKGROUND
              # --------------------------------------------------------

              for y in range(0, HEIGHT, 8):

                  for x in range(0, WIDTH, 8):

                      phase = (
                          x / WIDTH * .45 +
                          y / HEIGHT * .2 +
                          t
                      )

                      color = gradient_color(
                          phase
                      )

                      alpha = 13

                      draw.rectangle(
                          (
                              x,
                              y,
                              x + 8,
                              y + 8
                          ),
                          fill=(
                              color[0],
                              color[1],
                              color[2],
                              alpha
                          )
                      )


              # --------------------------------------------------------
              # LARGE MOVING GLOW
              # --------------------------------------------------------

              glow = Image.new(
                  "RGBA",
                  (WIDTH, HEIGHT),
                  (0, 0, 0, 0)
              )

              glow_draw = ImageDraw.Draw(
                  glow,
                  "RGBA"
              )

              gx = (
                  WIDTH / 2 +
                  math.sin(t * math.pi * 2) * 350
              )

              gy = (
                  HEIGHT / 2 +
                  math.cos(t * math.pi * 2) * 160
              )

              for radius in range(300, 20, -20):

                  alpha = int(
                      2 + (300 - radius) / 300 * 4
                  )

                  glow_draw.ellipse(
                      (
                          gx - radius,
                          gy - radius,
                          gx + radius,
                          gy + radius
                      ),
                      fill=(
                          0,
                          217,
                          255,
                          alpha
                      )
                  )

              glow = glow.filter(
                  ImageFilter.GaussianBlur(35)
              )

              image.alpha_composite(glow)


              draw = ImageDraw.Draw(
                  image,
                  "RGBA"
              )


              # --------------------------------------------------------
              # MOVING NEON WAVES
              # --------------------------------------------------------

              points = []

              for x in range(-40, WIDTH + 40, 10):

                  normalized = x / WIDTH

                  y = (
                      190
                      + math.sin(
                          normalized * math.pi * 3
                          + t * math.pi * 2
                      ) * 55
                      + math.sin(
                          normalized * math.pi * 7
                          - t * math.pi * 4
                      ) * 18
                  )

                  points.append((x, y))


              for offset in range(22, 0, -2):

                  alpha = int(
                      2 + (22 - offset) * 1.2
                  )

                  draw.line(
                      [
                          (x, y + offset)
                          for x, y in points
                      ],
                      fill=(
                          CYAN[0],
                          CYAN[1],
                          CYAN[2],
                          alpha
                      ),
                      width=2
                  )


              draw.line(
                  points,
                  fill=(
                      0,
                      217,
                      255,
                      100
                  ),
                  width=2
              )


              # --------------------------------------------------------
              # PARTICLES
              # --------------------------------------------------------

              for p in particles:

                  px = (
                      p["x"] +
                      frame_number * p["speed"] * 8
                  ) % WIDTH

                  py = p["y"]

                  alpha = int(
                      40 +
                      30 *
                      math.sin(
                          t * math.pi * 2 +
                          p["x"]
                      )
                  )

                  draw.ellipse(
                      (
                          px - p["size"],
                          py - p["size"],
                          px + p["size"],
                          py + p["size"]
                      ),
                      fill=(
                          255,
                          255,
                          255,
                          alpha
                      )
                  )


              # ========================================================
              # DASHBOARD CONTENT
              # ========================================================


              # --------------------------------------------------------
              # HEADER
              # --------------------------------------------------------

              draw.text(
                  (50, 35),
                  "GITHUB ACTIVITY",
                  fill=WHITE,
                  font=font(26, True)
              )

              # animated accent line

              line_offset = int(
                  (math.sin(t * math.pi * 2) + 1)
                  * 200
              )

              for x in range(50, 1150):

                  c = gradient_color(
                      (x + line_offset) / 800
                  )

                  draw.line(
                      (
                          x,
                          78,
                          x + 1,
                          78
                      ),
                      fill=c + (120,),
                      width=2
                  )


              # --------------------------------------------------------
              # STAT CARDS
              # --------------------------------------------------------

              stats = [
                  ("REPOSITORIES", repo_count, CYAN),
                  ("STARS", total_stars, PURPLE),
                  ("FORKS", total_forks, CYAN),
                  ("FOLLOWERS", followers, PURPLE)
              ]


              card_width = 255
              card_gap = 20
              start_x = 50
              stat_y = 105


              for i, (label, value, color) in enumerate(stats):

                  x = (
                      start_x +
                      i * (card_width + card_gap)
                  )

                  rounded_card(
                      draw,
                      (
                          x,
                          stat_y,
                          x + card_width,
                          stat_y + 90
                      )
                  )

                  draw.text(
                      (x + 20, stat_y + 17),
                      label,
                      fill=MUTED,
                      font=font(11, True)
                  )

                  draw.text(
                      (x + 20, stat_y + 43),
                      str(value),
                      fill=color,
                      font=font(27, True)
                  )


              # --------------------------------------------------------
              # PROJECT DASHBOARD
              # --------------------------------------------------------

              draw.text(
                  (50, 225),
                  "PROJECTS",
                  fill=WHITE,
                  font=font(19, True)
              )


              project_x = 50
              project_y = 260

              project_width = 540
              project_height = 82

              for i, repo in enumerate(projects):

                  row = i // 2
                  col = i % 2

                  x = (
                      project_x +
                      col * 560
                  )

                  y = (
                      project_y +
                      row * 95
                  )


                  rounded_card(
                      draw,
                      (
                          x,
                          y,
                          x + project_width,
                          y + project_height
                      )
                  )


                  name = truncate(
                      repo.get("name", ""),
                      28
                  )

                  description = truncate(
                      repo.get("description", ""),
                      62
                  )


                  draw.ellipse(
                      (
                          x + 18,
                          y + 18,
                          x + 30,
                          y + 30
                      ),
                      fill=gradient_color(
                          t + i * .1
                      )
                  )


                  draw.text(
                      (x + 42, y + 14),
                      name,
                      fill=WHITE,
                      font=font(15, True)
                  )


                  if description:

                      draw.text(
                          (x + 42, y + 38),
                          description,
                          fill=MUTED,
                          font=font(10)
                      )


                  stars = repo.get(
                      "stargazers_count",
                      0
                  )

                  forks = repo.get(
                      "forks_count",
                      0
                  )


                  draw.text(
                      (x + 42, y + 60),
                      f"★ {stars}    ◇ {forks}",
                      fill=gradient_color(
                          t + i * .08
                      ),
                      font=font(10, True)
                  )


              # --------------------------------------------------------
              # BOTTOM DASHBOARD
              # --------------------------------------------------------

              bottom_y = 570


              # Languages

              rounded_card(
                  draw,
                  (
                      50,
                      bottom_y,
                      560,
                      720
                  )
              )


              draw.text(
                  (75, bottom_y + 20),
                  "LANGUAGES",
                  fill=WHITE,
                  font=font(16, True)
              )


              language_total = max(
                  sum(
                      count
                      for _, count in languages
                  ),
                  1
              )


              for i, (language, count) in enumerate(
                  languages
              ):

                  y = (
                      bottom_y +
                      58 +
                      i * 25
                  )

                  percentage = (
                      count /
                      language_total
                  )

                  color = gradient_color(
                      i / max(len(languages), 1)
                  )


                  draw.ellipse(
                      (
                          75,
                          y,
                          85,
                          y + 10
                      ),
                      fill=color
                  )


                  draw.text(
                      (95, y - 3),
                      language,
                      fill=WHITE,
                      font=font(10)
                  )


                  draw.rounded_rectangle(
                      (
                          190,
                          y,
                          520,
                          y + 10
                      ),
                      radius=5,
                      fill=(255, 255, 255, 12)
                  )


                  draw.rounded_rectangle(
                      (
                          190,
                          y,
                          190 +
                          int(
                              330 *
                              percentage
                          ),
                          y + 10
                      ),
                      radius=5,
                      fill=color
                  )


              # --------------------------------------------------------
              # CONTRIBUTION ACTIVITY
              # --------------------------------------------------------

              rounded_card(
                  draw,
                  (
                      580,
                      bottom_y,
                      1150,
                      720
                  )
              )


              draw.text(
                  (605, bottom_y + 20),
                  "RECENT ACTIVITY",
                  fill=WHITE,
                  font=font(16, True)
              )


              # Contribution heatmap

              cell = 13

              gap = 3

              start_x = 605

              start_y = bottom_y + 55


              # Last 12 weeks

              from datetime import date, timedelta

              today = date.today()

              start = (
                  today -
                  timedelta(days=83)
              )


              for day_index in range(84):

                  current = (
                      start +
                      timedelta(days=day_index)
                  )

                  week = day_index // 7

                  weekday = current.weekday()

                  count = contribution_days.get(
                      current.isoformat(),
                      0
                  )


                  intensity = min(
                      count / 5,
                      1
                  )


                  if count == 0:

                      color = (
                          255,
                          255,
                          255,
                          10
                      )

                  else:

                      base = gradient_color(
                          current.toordinal() / 20
                      )

                      alpha = int(
                          40 +
                          intensity * 180
                      )

                      color = (
                          base[0],
                          base[1],
                          base[2],
                          alpha
                      )


                  x = (
                      start_x +
                      week *
                      (cell + gap)
                  )

                  y = (
                      start_y +
                      weekday *
                      (cell + gap)
                  )


                  draw.rounded_rectangle(
                      (
                          x,
                          y,
                          x + cell,
                          y + cell
                      ),
                      radius=3,
                      fill=color
                  )


              # --------------------------------------------------------
              # SAVE FRAME
              # --------------------------------------------------------

              image = image.convert(
                  "RGB"
              )

              frames.append(image)


          # ============================================================
          # SAVE GIF
          # ============================================================

          Path("assets").mkdir(
              exist_ok=True
          )


          output = (
              "assets/dashboard.gif"
          )


          frames[0].save(
              output,
              save_all=True,
              append_images=frames[1:],
              duration=FRAME_DURATION,
              loop=0,
              optimize=True,
              disposal=2
          )


          print(
              f"Created {output}"
          )

          print(
              f"Frames: {len(frames)}"
          )

          print(
              f"Size: {Path(output).stat().st_size / 1024 / 1024:.2f} MB"
          )

          PY

      - name: Commit dashboard
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/dashboard.gif

          if git diff --cached --quiet; then

            echo "No dashboard changes."

          else

            git commit \
              -m "Update animated profile dashboard"

            git push

          fi
