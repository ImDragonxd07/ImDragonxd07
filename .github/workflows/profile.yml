          stroke-linecap="round">
          
          <path
          d="M-100 250
          C150 30 300 400 520 180
          S900 30 1300 230"
          
          stroke="url(#neon)"
          stroke-width="2"
          opacity=".7">
          
          <animate
          attributeName="d"
          
          values="
          M-100 250 C150 30 300 400 520 180 S900 30 1300 230;
          M-100 180 C120 390 330 40 560 230 S920 350 1300 140;
          M-100 250 C150 30 300 400 520 180 S900 30 1300 230"
          
          dur="12s"
          repeatCount="indefinite"/>
          
          </path>
          
          
          <path
          d="M-100 650
          C200 430 330 760 580 540
          S950 400 1300 620"
          
          stroke="#7c3aed"
          stroke-width="2"
          opacity=".35">
          
          <animate
          attributeName="d"
          
          values="
          M-100 650 C200 430 330 760 580 540 S950 400 1300 620;
          M-100 580 C180 760 360 420 620 600 S980 720 1300 520;
          M-100 650 C200 430 330 760 580 540 S950 400 1300 620"
          
          dur="15s"
          repeatCount="indefinite"/>
          
          </path>
          
          </g>
          
          
          <!-- PARTICLES -->
          
          <g fill="#ffffff">
          
          <circle cx="120" cy="180" r="1.5">
          <animate attributeName="cy"
          values="180;130;180"
          dur="5s"
          repeatCount="indefinite"/>
          </circle>
          
          <circle cx="280" cy="600" r="1">
          <animate attributeName="cy"
          values="600;540;600"
          dur="7s"
          repeatCount="indefinite"/>
          </circle>
          
          <circle cx="470" cy="110" r="1.5">
          <animate attributeName="cy"
          values="110;70;110"
          dur="6s"
          repeatCount="indefinite"/>
          </circle>
          
          <circle cx="720" cy="680" r="1">
          <animate attributeName="cy"
          values="680;620;680"
          dur="8s"
          repeatCount="indefinite"/>
          </circle>
          
          <circle cx="930" cy="140" r="1.5">
          <animate attributeName="cy"
          values="140;90;140"
          dur="6s"
          repeatCount="indefinite"/>
          </circle>
          
          <circle cx="1080" cy="520" r="1">
          <animate attributeName="cy"
          values="520;460;520"
          dur="7s"
          repeatCount="indefinite"/>
          </circle>
          
          </g>
          
          
          <!-- HEADER -->
          
          <text
          x="60"
          y="70"
          fill="#ffffff"
          font-size="26"
          font-weight="bold"
          font-family="Arial, sans-serif">
          
          GitHub Activity
          
          </text>
          
          
          <rect
          x="60"
          y="88"
          width="1080"
          height="2"
          rx="1"
          fill="url(#neon)"
          opacity=".7">
          
          
          <animate
          attributeName="opacity"
          values=".35;.9;.35"
          dur="3s"
          repeatCount="indefinite"/>
          
          </rect>
          
          
          <!-- STAT CARDS -->
          
          <g>
          
          <rect x="60" y="125"
          width="250" height="90"
          rx="16"
          fill="#ffffff"
          fill-opacity=".035"
          stroke="#ffffff"
          stroke-opacity=".08"/>
          
          <text x="85" y="157"
          fill="#8b949e"
          font-size="11"
          font-family="Arial">
          
          REPOSITORIES
          
          </text>
          
          <text x="85" y="195"
          fill="#00d9ff"
          font-size="29"
          font-weight="bold"
          font-family="Arial">
          
          {len(repos)}
          
          </text>
          
          
          <rect x="330" y="125"
          width="250" height="90"
          rx="16"
          fill="#ffffff"
          fill-opacity=".035"
          stroke="#ffffff"
          stroke-opacity=".08"/>
          
          <text x="355" y="157"
          fill="#8b949e"
          font-size="11"
          font-family="Arial">
          
          STARS
          
          </text>
          
          <text x="355" y="195"
          fill="#7c3aed"
          font-size="29"
          font-weight="bold"
          font-family="Arial">
          
          {total_stars}
          
          </text>
          
          
          <rect x="600" y="125"
          width="250" height="90"
          rx="16"
          fill="#ffffff"
          fill-opacity=".035"
          stroke="#ffffff"
          stroke-opacity=".08"/>
          
          <text x="625" y="157"
          fill="#8b949e"
          font-size="11"
          font-family="Arial">
          
          FORKS
          
          </text>
          
          <text x="625" y="195"
          fill="#00d9ff"
          font-size="29"
