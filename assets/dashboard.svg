        <rect x="0" y="0" width="202" height="82" rx="14"
              fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" class="stat-breathe" style="animation-delay:1.20s"/>
        <g clip-path="url(#statclip3)">
          <rect x="-70" y="0" width="70" height="82" fill="url(#sweepGrad)"
