</circle>

<circle cx="930" cy="140" r="1.5">
<animate attributeName="cy"
values="140;90;140"
dur="6s"
repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="520" r="1">
<animate attributeName="cy"
values="520;460;520"
dur="7s"
repeatCount="indefinite"/>
</circle>

</g>


