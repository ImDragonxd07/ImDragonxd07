<svg xmlns="http://www.w3.org/2000/svg"
width="1200"
height="850"
viewBox="0 0 1200 850">

<defs>

<!-- Moving background -->

<linearGradient id="bg"
x1="0%" y1="0%"
x2="100%" y2="100%">

<stop offset="0%" stop-color="#03050b">
    <animate
        attributeName="stop-color"
        values="#03050b;#09051a;#03050b"
        dur="12s"
        repeatCount="indefinite"/>
</stop>

<stop offset="50%" stop-color="#10082a">
    <animate
        attributeName="stop-color"
        values="#10082a;#061a24;#10082a"
        dur="12s"
        repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#020810">
    <animate
        attributeName="stop-color"
        values="#020810;#11051f;#020810"
        dur="12s"
        repeatCount="indefinite"/>
</stop>

</linearGradient>


<!-- Moving neon -->

<linearGradient id="neon"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#00d9ff">
    <animate
        attributeName="offset"
        values="0%;20%;0%"
        dur="5s"
        repeatCount="indefinite"/>
</stop>

<stop offset="50%" stop-color="#7c3aed">
    <animate
        attributeName="offset"
        values="50%;70%;50%"
        dur="5s"
        repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#00d9ff">
    <animate
        attributeName="offset"
        values="100%;80%;100%"
        dur="5s"
        repeatCount="indefinite"/>
</stop>

</linearGradient>


<radialGradient id="glow">

<stop offset="0%" stop-color="#00d9ff" stop-opacity=".25"/>
<stop offset="45%" stop-color="#7c3aed" stop-opacity=".1"/>
<stop offset="100%" stop-color="#000" stop-opacity="0"/>

</radialGradient>


<filter id="blur">

<feGaussianBlur stdDeviation="35"/>

</filter>


<filter id="softGlow">

<feGaussianBlur stdDeviation="8"/>

</filter>

</defs>


<!-- BACKGROUND -->

<rect
width="1200"
height="850"
rx="24"
fill="url(#bg)"/>


<!-- MOVING GLOWS -->

<circle
cx="150"
cy="120"
r="280"
fill="url(#glow)"
filter="url(#blur)">

<animate
attributeName="cx"
values="150;350;150"
dur="14s"
repeatCount="indefinite"/>

<animate
attributeName="cy"
values="120;250;120"
dur="11s"
repeatCount="indefinite"/>

</circle>


<circle
cx="1050"
cy="700"
r="330"
fill="url(#glow)"
filter="url(#blur)">

<animate
attributeName="cx"
values="1050;850;1050"
dur="16s"
repeatCount="indefinite"/>

<animate
attributeName="cy"
values="700;550;700"
dur="13s"
repeatCount="indefinite"/>

</circle>


<!-- MOVING WAVES -->

<g
fill="none"
stroke-linecap="round">

<path
d="M-100 250
C150 30 300 400 520 180
S900 30 1300 230"

stroke="url(#neon)"
stroke-width="2"
opacity=".7">

<animate
attributeName="d"

values="
M-100 250 C150 30 300 400 520 180 S900 30 1300 230;
M-100 180 C120 390 330 40 560 230 S920 350 1300 140;
M-100 250 C150 30 300 400 520 180 S900 30 1300 230"

dur="12s"
repeatCount="indefinite"/>

</path>


<path
d="M-100 650
C200 430 330 760 580 540
S950 400 1300 620"

stroke="#7c3aed"
stroke-width="2"
opacity=".35">

<animate
attributeName="d"

values="
M-100 650 C200 430 330 760 580 540 S950 400 1300 620;
M-100 580 C180 760 360 420 620 600 S980 720 1300 520;
M-100 650 C200 430 330 760 580 540 S950 400 1300 620"

dur="15s"
repeatCount="indefinite"/>

</path>

</g>


<!-- PARTICLES -->

<g fill="#ffffff">

<circle cx="120" cy="180" r="1.5">
<animate attributeName="cy"
values="180;130;180"
dur="5s"
repeatCount="indefinite"/>
</circle>

<circle cx="280" cy="600" r="1">
<animate attributeName="cy"
values="600;540;600"
dur="7s"
repeatCount="indefinite"/>
</circle>

<circle cx="470" cy="110" r="1.5">
<animate attributeName="cy"
