        </g>
        <text x="101" y="36" text-anchor="middle" class="stat-value" filter="url(#softGlow)">81</text>
        <text x="101" y="60" text-anchor="middle" class="stat-label">Contributions / yr</text>
      </g>

  <text x="32" y="232" class="section-title">TOP LANGUAGES</text>
  <text x="490" y="232" class="section-title">TOP REPOSITORIES</text>

  
